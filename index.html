<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .display {
            padding: 20px;
            text-align: right;
            background: #222;
            color: white;
            font-size: 24px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        #result {
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #ddd;
        }

        .btn {
            border: none;
            padding: 20px;
            font-size: 18px;
            cursor: pointer;
            background: white;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #e0e0e0;
        }

        .clear {
            background: #ff9500;
            color: white;
        }

        .clear:hover {
            background: #db8400;
        }

        .equals {
            background: #4cd964;
            color: white;
        }

        .equals:hover {
            background: #3bc854;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <span id="result">0</span>
        </div>
        <div class="buttons">
            <button class="btn clear">C</button>
            <button class="btn">/</button>
            <button class="btn">*</button>
            <button class="btn">-</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">+</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn equals">=</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn" style="grid-row: span 2;">0</button>
            <button class="btn">.</button>
        </div>
    </div>

    <script>
        const resultElement = document.getElementById('result');
        let currentInput = '0';
        let previousInput = '';
        let operation = null;

        function updateDisplay() {
            resultElement.textContent = currentInput;
        }

        function inputNumber(number) {
            if (currentInput === '0') {
                currentInput = number;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function inputDecimal() {
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function setOperation(nextOperation) {
            if (operation !== null) {
                calculate();
            }
            previousInput = currentInput;
            currentInput = '0';
            operation = nextOperation;
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        currentInput = 'Ошибка';
                        operation = null;
                        previousInput = '';
                        updateDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                default:
                    return;
            }

            currentInput = computation.toString();
            operation = null;
            previousInput = '';
            updateDisplay();
        }

        function clear() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;

                if (['+', '-', '*', '/'].includes(value)) {
                    setOperation(value);
                    return;
                }

                if (value === '=') {
                    calculate();
                    return;
                }

                if (value === 'C') {
                    clear();
                    return;
                }

                if (value === '.') {
                    inputDecimal();
                    return;
                }

                inputNumber(value);
            });
        });

        // Инициализация дисплея
        updateDisplay();
    </script>
</body>
</html>
